<title>Emendas: Novo Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar marinho fixa (256px) + topbar branca + área de trabalho clara com cartões. Proposta do documento "Sistema de Design CentralTech", adaptada à plataforma real. */
:root{
  --sidebar:#0B2536; --sidebar-ativo:#163A50; --sidebar-muted:#94A3B8;
  --canvas:#F3F6F8; --surface:#FFFFFF; --surface-2:#F8FAFC; --border:#E2E8F0; --border-2:#F1F5F9;
  --tx:#0F172A; --tx-2:#475569; --tx-3:#64748B;
  --acc:#6B4FBB; --acc-h:#5B3FA8; --acc-soft:#EFEBFA; --acc-tx:#5B3FA8; --barra:#10B981;
  --ok-bg:#DCFCE7; --ok-tx:#166534; --ok:#10B981;
  --info-bg:#DBEAFE; --info-tx:#1E40AF; --info:#3B82F6;
  --warn-bg:#FEF3C7; --warn-tx:#92400E; --warn:#F59E0B;
  --crit-bg:#FEE2E2; --crit-tx:#B91C1C; --crit:#EF4444;
  --neu-bg:#F1F5F9; --neu-tx:#475569; --neu:#94A3B8;
  --g-emp:#0B2536; --g-pago:#10B981; --tooltip:#0F172A;
  --sombra:0 1px 2px 0 rgb(0 0 0 / .05);
  --f:"Inter","Plus Jakarta Sans",system-ui,sans-serif;
}
:root[data-acento="esmeralda"]{--acc:#107E68;--acc-h:#0D6654;--acc-soft:#E6F4F0;--acc-tx:#0D6654}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0B1220; --surface:#111A2B; --surface-2:#0E1626; --border:#22304A; --border-2:#1A263B;
  --tx:#E5EAF2; --tx-2:#B4C0D3; --tx-3:#8D9AB0; --acc-soft:#2A2350; --acc-tx:#B9A6F0;
  --ok-bg:#0F3A2A; --ok-tx:#7CE3B0; --info-bg:#132B55; --info-tx:#9CC3FF; --warn-bg:#3B2A0A; --warn-tx:#F8CF7A;
  --crit-bg:#3E1518; --crit-tx:#FCA5A5; --neu-bg:#1C2738; --neu-tx:#B4C0D3; --g-emp:#7C93B5; --tooltip:#020617; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0B1220; --surface:#111A2B; --surface-2:#0E1626; --border:#22304A; --border-2:#1A263B;
  --tx:#E5EAF2; --tx-2:#B4C0D3; --tx-3:#8D9AB0; --acc-soft:#2A2350; --acc-tx:#B9A6F0;
  --ok-bg:#0F3A2A; --ok-tx:#7CE3B0; --info-bg:#132B55; --info-tx:#9CC3FF; --warn-bg:#3B2A0A; --warn-tx:#F8CF7A;
  --crit-bg:#3E1518; --crit-tx:#FCA5A5; --neu-bg:#1C2738; --neu-tx:#B4C0D3; --g-emp:#7C93B5; --tooltip:#020617; color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-acento="esmeralda"]:not([data-theme="light"]){--acc-soft:#0F3A30;--acc-tx:#6FD6BB}}
:root[data-theme="dark"][data-acento="esmeralda"]{--acc-soft:#0F3A30;--acc-tx:#6FD6BB}

*{box-sizing:border-box}
body{background:var(--canvas);color:var(--tx);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased;margin:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:inherit}

/* Faixa de aviso do mockup */
.aviso{background:var(--acc);color:#fff;font-size:12.5px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.aviso b{font-weight:600}
.aviso .opc{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.aviso .opc button{background:rgb(255 255 255 / .14);border:1px solid rgb(255 255 255 / .3);color:#fff;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px}
.aviso .opc button[aria-pressed="true"]{background:#fff;color:#0B2536}

.app{display:flex;min-height:calc(100dvh - 34px)}
/* Sidebar */
.side{width:256px;flex:none;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;padding-left:env(safe-area-inset-left,0px)}
.marca{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid rgb(255 255 255 / .08)}
.logo{width:30px;height:30px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-weight:700;font-size:13px;box-shadow:0 0 0 3px rgb(255 255 255 / .08)}
.marca .nome{font-weight:700;font-size:15px;line-height:1.1}
.marca .nome span{color:#C9B8F0}
:root[data-acento="esmeralda"] .marca .nome span{color:#34D399}
.marca small{display:block;font-weight:500;font-size:11px;color:var(--sidebar-muted);margin-top:2px}
.volta{margin:12px 12px 0;display:flex;align-items:center;gap:8px;border:1px solid rgb(255 255 255 / .16);border-radius:8px;padding:7px 10px;color:var(--sidebar-muted);text-decoration:none;font-size:12.5px}
.volta:hover{color:#fff;border-color:rgb(255 255 255 / .3)}
nav.menu{padding:12px;overflow:auto;flex:1}
.grupo{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#64809A;font-weight:600;padding:14px 10px 6px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#CBD5E1;text-decoration:none;font-size:13.5px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.item svg{width:18px;height:18px;stroke:var(--sidebar-muted);flex:none}
.item:hover{background:rgb(255 255 255 / .05);color:#fff}
.item[aria-current="page"]{background:var(--sidebar-ativo);color:#fff;font-weight:500;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .1)}
.item[aria-current="page"] svg{stroke:#fff}
.item .selo{margin-left:auto;background:#EF4444;color:#fff;border-radius:999px;font-size:10.5px;font-weight:600;padding:1px 7px}
.item .selo.n{background:rgb(255 255 255 / .12);color:#CBD5E1}
.user{border-top:1px solid rgb(255 255 255 / .1);padding:14px 16px;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--neu-bg);color:var(--neu-tx);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;border:1px solid var(--border)}
.user .av{background:rgb(255 255 255 / .1);color:#fff;border-color:rgb(255 255 255 / .15)}
.user b{font-size:13px;font-weight:500;display:block}
.user small{font-size:11.5px;color:var(--sidebar-muted)}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico.hamb{display:none}
.crumb{font-size:13px;color:var(--tx-3);display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--tx);font-weight:500}
.top .dir{margin-left:auto;display:flex;align-items:center;gap:6px}
.busca{display:flex;align-items:center;gap:8px;width:240px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--tx-3);font-size:13px}
.busca svg{width:16px;height:16px;stroke:currentColor}
.ex{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;background:var(--surface)}
.ex i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.ico{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;border:0;background:none;color:var(--tx-2);cursor:pointer;position:relative}
.ico:hover{background:var(--surface-2)}
.ico svg{width:18px;height:18px;stroke:currentColor}
.ico .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--surface)}

.conteudo{padding:24px;display:flex;flex-direction:column;gap:24px;max-width:1440px;width:100%}
@media (min-width:1024px){.conteudo{padding:32px}}
.cab{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cab .t{flex:1;min-width:240px}
h1{font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.02em;margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;text-wrap:balance}
.sub{color:var(--tx-3);font-size:13.5px;margin:4px 0 0}
h2{font-size:16px;line-height:24px;font-weight:600;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.neu{background:var(--neu-bg);color:var(--neu-tx)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--tx);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;stroke:currentColor}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-h)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sombra)}
.card.p5{padding:20px}.card.p6{padding:24px}
.card-h{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
.card-h p{margin:2px 0 0;color:var(--tx-3);font-size:12.5px}

.kpis{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .lb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--tx-2)}
.kpi .lb i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-tx)}
.kpi .lb i svg{width:16px;height:16px;stroke:currentColor}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:12px;line-height:32px}
.kpi .s{font-size:12.5px;color:var(--tx-3);margin-top:6px}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog .tr{flex:1;height:8px;border-radius:999px;background:var(--neu-bg);overflow:hidden;display:flex}
.prog .tr span{display:block;height:100%}
.prog b{font-size:12.5px;font-weight:600}
.kpi.alerta .lb i{background:var(--warn-bg);color:var(--warn-tx)}
.tag-acao{display:inline-flex;margin-top:8px;background:var(--warn-bg);color:var(--warn-tx);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600}

.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%}
.t-ok{background:var(--ok-bg);color:var(--ok-tx)}.t-ok i{background:var(--ok)}
.t-info{background:var(--info-bg);color:var(--info-tx)}.t-info i{background:var(--info)}
.t-warn{background:var(--warn-bg);color:var(--warn-tx)}.t-warn i{background:var(--warn)}
.t-crit{background:var(--crit-bg);color:var(--crit-tx)}.t-crit i{background:var(--crit)}
.t-neu{background:var(--neu-bg);color:var(--neu-tx)}.t-neu i{background:var(--neu)}

.g12{display:grid;gap:24px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c4{grid-column:span 4}.c12{grid-column:span 12}
.c7,.c5,.c6,.c8,.c4{min-width:0}

/* gráficos */
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx-2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:3px}
svg text{fill:var(--tx-3);font-size:11px;font-family:var(--f)}
.grade{stroke:var(--border-2)}
.tip{position:fixed;pointer-events:none;background:var(--tooltip);color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;z-index:50;box-shadow:0 8px 24px rgb(0 0 0 / .2);line-height:1.5}
.tip b{font-weight:600}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-leg{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.donut-leg div{display:flex;align-items:center;gap:8px;font-size:12.5px}
.donut-leg i{width:10px;height:10px;border-radius:3px;flex:none}
.donut-leg span{flex:1;color:var(--tx-2);min-width:0}
.donut-leg b{font-weight:600}
.donut-leg em{font-style:normal;color:var(--tx-3);width:40px;text-align:right}

.rank{display:flex;flex-direction:column}
.rank .l{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border-2)}
.rank .l:first-child{border-top:0}
.rank .nm{font-weight:500;font-size:13.5px}
.rank .nm small{display:block;color:var(--tx-3);font-weight:400;font-size:12px}
.rank .vl{text-align:right;font-weight:600;font-size:13.5px}
.rank .vl small{display:block;color:var(--tx-3);font-weight:400;font-size:12px}
.mini{height:6px;border-radius:999px;background:var(--neu-bg);margin-top:6px;overflow:hidden}
.mini span{display:block;height:100%;border-radius:999px}

.feed{display:flex;flex-direction:column;gap:0}
.feed .e{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;padding:10px 0;position:relative}
.feed .e:before{content:"";position:absolute;left:9px;top:28px;bottom:-10px;width:2px;background:var(--border-2)}
.feed .e:last-child:before{display:none}
.feed .m{width:12px;height:12px;border-radius:50%;margin:4px 0 0 4px;box-shadow:0 0 0 3px var(--surface)}
.feed p{margin:0;font-size:13.5px}
.feed small{color:var(--tx-3);font-size:12px}

/* filtros e tabela */
.filtros{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px}
.fbusca{flex:1;min-width:240px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:0 10px;background:var(--surface)}
.fbusca svg{width:16px;height:16px;stroke:var(--tx-3);flex:none}
.fbusca input{border:0;outline:0;background:none;padding:9px 0;width:100%;font-size:13.5px}
.filtros select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px;min-width:140px;max-width:220px;color:var(--tx-2)}
.limpar{border:0;background:none;color:var(--acc-tx);font-weight:500;cursor:pointer;font-size:13px}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto}
.aba{border:0;background:none;padding:12px 12px;font-size:13.5px;font-weight:500;color:var(--tx-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.aba[aria-selected="true"]{color:var(--tx);border-bottom-color:var(--acc)}
.aba .cnt{background:var(--neu-bg);color:var(--neu-tx);border-radius:999px;padding:0 7px;font-size:11.5px}
.aba .fx{width:8px;height:8px;border-radius:2px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--surface-2);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx-3);padding:10px 12px;text-align:left;white-space:nowrap}
thead th.r,td.r{text-align:right}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
tbody td{padding:12px 12px;border-top:1px solid var(--border-2);vertical-align:middle;color:var(--tx-2)}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tbody tr.clic{cursor:pointer}
.cod{font-weight:600;color:var(--tx)}
.cod small{display:block;color:var(--tx-3);font-weight:400;font-size:12px}
.autor{display:flex;gap:10px;align-items:center;min-width:170px}
.autor .av{width:32px;height:32px;font-size:11px}
.autor b{font-weight:500;color:var(--tx);display:block;font-size:13.5px}
.autor small{color:var(--tx-3);font-size:12px}
.obj{max-width:300px;min-width:200px}
.obj b{font-weight:500;color:var(--tx);display:block;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.obj small{color:var(--tx-3);font-size:12px;display:block;margin-top:2px}
.tipo-fx{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.tipo-fx i{width:8px;height:8px;border-radius:2px}
.acs{display:flex;gap:2px;justify-content:flex-end}
.acs button{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--tx-3);cursor:pointer;display:grid;place-items:center}
.acs button:hover{background:var(--neu-bg);color:var(--tx)}
.acs svg{width:16px;height:16px;stroke:currentColor}
.pag{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--tx-3);flex-wrap:wrap}
.pag .bt{display:flex;gap:6px;align-items:center}
.pag select{border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:var(--surface)}
.pag button{border:1px solid var(--border);border-radius:8px;padding:5px 10px;background:var(--surface);cursor:pointer}
.pag button:disabled{opacity:.4;cursor:default}
.vazio{text-align:center;padding:48px 16px;color:var(--tx-3)}
.vazio .c{width:48px;height:48px;border-radius:50%;background:var(--neu-bg);display:grid;place-items:center;margin:0 auto 12px}
.vazio b{display:block;color:var(--tx);font-weight:600;margin-bottom:8px}

/* detalhe */
.stepper{display:flex;overflow-x:auto;padding:6px 2px 4px}
.passo{flex:1;min-width:88px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 4px}
.passo:before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:2px;background:var(--border)}
.passo:first-child:before{display:none}
.passo.feito:before,.passo.atual:before{background:var(--ok)}
.bola{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;background:var(--neu-bg);border:2px solid var(--surface)}
.bola svg{width:16px;height:16px;stroke:#fff}
.feito .bola{background:var(--ok)}
.presum .bola{background:var(--surface);border:2px dashed var(--ok)}
.presum .bola svg{stroke:var(--ok)}
.atual .bola{background:var(--surface);border:2px solid var(--info);box-shadow:0 0 0 4px var(--info-bg)}
.atual .bola:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--info)}
.na .bola{background:var(--surface);border:1px dashed var(--border)}
.passo b{font-size:12px;font-weight:600;margin-top:8px;line-height:1.3;color:var(--tx)}
.passo.pend b,.passo.na b{color:var(--tx-3);font-weight:500}
.passo small{font-size:11px;color:var(--tx-3);margin-top:2px}
.fin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fin>div{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--surface-2)}
.fin span{font-size:12px;color:var(--tx-3);font-weight:500;display:flex;gap:6px;align-items:center}
.fin b{display:block;font-size:18px;font-weight:700;margin-top:6px}
.fin small{color:var(--tx-3);font-size:11.5px}
.kv{display:flex;flex-direction:column}
.kv div{padding:10px 0;border-top:1px solid var(--border-2);display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;font-size:13px}
.kv div:first-child{border-top:0;padding-top:0}
.kv dt{color:var(--tx-3)}
.kv dd{margin:0;color:var(--tx);font-weight:500;overflow-wrap:anywhere}
.doc{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-top:8px}
.doc:hover{background:var(--surface-2)}
.doc svg{width:18px;height:18px;stroke:var(--tx-3);flex:none}
.doc span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.drop{border:2px dashed var(--border);border-radius:12px;background:var(--surface-2);padding:16px;text-align:center;font-size:12.5px;color:var(--tx-3);margin-top:12px}
.dabas{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:16px}
.alerta-l{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn-tx);font-size:13px}
.alerta-l svg{width:18px;height:18px;stroke:currentColor;flex:none;margin-top:1px}

/* relatório */
.rel{max-width:980px}
.rel h3{font-size:15px;margin:0 0 10px}
.rel table td,.rel table th{padding:9px 12px}
.rel ul{margin:0;padding-left:18px;color:var(--tx-2);line-height:1.6}
.rel p{color:var(--tx-2);line-height:1.6;margin:0 0 10px;max-width:72ch}
.sev{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}

.placeholder{display:grid;place-items:center;text-align:center;padding:64px 24px;color:var(--tx-3)}
.placeholder b{color:var(--tx);display:block;font-size:16px;margin-bottom:6px}

@media (max-width:1023px){
  .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.aberta{transform:none;box-shadow:0 0 0 100vmax rgb(2 6 23 / .45)}
  .ico.hamb{display:grid}
  .busca{display:none}
}
@media (max-width:640px){.kpis{grid-template-columns:1fr}.fin{grid-template-columns:repeat(2,minmax(0,1fr))}.conteudo{padding:16px}.top .ocultar{display:none}.kv div{grid-template-columns:1fr;gap:2px}.ex{display:none}.acoes{align-items:flex-start!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    ${d?`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Documento</th><th class="r">Valor (R$)</th><th>Status</th><th class="r">Ações</th></tr></thead><tbody>${d.movs.map(m=>`<tr><td class="num">${m[0]}</td><td>${m[1]}</td><td class="num">${m[2]}</td><td class="r num" style="color:var(--tx);font-weight:500">${brl(m[3])}</td><td><span class="badge ${m[4]}"><i></i>${m[5]}</span></td><td><div class="acs"><button aria-label="Anexo">${ic("clip")}</button><button aria-label="Mais ações">${ic("more")}</button></div></td></tr>`).join("")}</tbody></table></div>`
     :`<p class="sub">No mockup, os lançamentos detalhados aparecem só na emenda nº 043. Os totais acima são reais.</p>`}`:
    abaDet==="pend"?(d?`<div class="alerta-l">${ic("alert")}<div><b>Datas fora de ordem</b> · o extrato do termo foi publicado em 04/10/2026, depois do repasse (29/07/2026). Lei 13.019/2014, art. 38. <br><button class="limpar" style="padding:0;margin-top:6px">Justificar</button></div></div>`:`<p class="sub">As pendências reais continuam calculadas como hoje.</p>`):

/* ---------- VEREADORES ---------- */
function vereadores(){
 const m={};E.forEach(x=>{const o=m[x.vn]??={v:0,c:0,pago:0,emp:0,s:0};o.v+=x.v;o.c++;o.pago+=x.pago;o.emp+=x.emp;if(x.saude)o.s+=x.v});
 const partidos=new Set(VEREADORES.map(v=>v[2]));const ativos=VEREADORES.filter(v=>v[3]).length;
 return `<div class="cab"><div class="t"><h1>Vereadores</h1><p class="sub">Cota individual de ${brl(COTA)} em 2026 · mínimo de ${SAUDE_MIN}% na Saúde</p></div><div class="acoes"><button class="btn pri">${ic("plus")}Novo vereador</button></div></div>
 <section class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
  <div class="card p5 kpi"><div class="lb"><i>${ic("users")}</i>Vereadores</div><div class="v num">${ativos} ativos</div><div class="s">${VEREADORES.length} cadastrados (1 mandato cassado, 1 suplente)</div></div>
  <div class="card p5 kpi"><div class="lb"><i>${ic("land")}</i>Partidos</div><div class="v num">${partidos.size}</div><div class="s">representados nas emendas</div></div>
  <div class="card p5 kpi"><div class="lb"><i>${ic("trend")}</i>Média por autor</div><div class="v num">${brl(E.reduce((a,x)=>a+x.v,0)/Object.keys(m).length)}</div><div class="s num">${Object.keys(m).length} autores com emendas</div></div>
 </section>
 <section class="card"><div class="tbl-wrap"><table><thead><tr><th>Parlamentar</th><th>Recursos / cota</th><th class="r">Empenhado</th><th class="r">Pago</th><th>Saúde</th><th>Situação</th></tr></thead><tbody>
 ${VEREADORES.map(v=>{const o=m[v[0]]||{v:0,c:0,pago:0,emp:0,s:0};const u=o.v/COTA*100;const sp=o.v?o.s/o.v*100:0;
  return `<tr><td><div class="autor"><div class="av">${ini(v[1])}</div><div><b>${esc(v[1])}</b><small>${v[2]} · ${o.c} emendas</small></div></div></td>
  <td style="min-width:200px"><b class="num" style="color:var(--tx)">${brl(o.v)}</b><div class="mini"><span style="width:${Math.min(100,u)}%;background:${u>100.01?"var(--crit)":"var(--barra)"}"></span></div><small class="num" style="color:var(--tx-3)">Cota: ${u.toLocaleString("pt-BR",{maximumFractionDigits:1})}%</small></td>
  <td class="r num">${brl(o.emp)}</td><td class="r num">${brl(o.pago)}</td>
  <td>${o.v?`<span class="badge ${sp>=SAUDE_MIN?"t-ok":"t-warn"}"><i></i><span class="num">${sp.toLocaleString("pt-BR",{maximumFractionDigits:0})}%</span></span>`:"—"}</td>
  <td>${v[3]?`<span class="badge t-ok"><i></i>Ativo</span>`:`<span class="badge t-crit"><i></i>Afastado</span>`}</td></tr>`}).join("")}
 </tbody></table></div></section>`;
}

/* ---------- O QUE MUDA ---------- */
function analise(){
 const L=(s,t)=>`<span class="sev ${s}">${t}</span>`;
 return `<div class="rel" style="display:flex;flex-direction:column;gap:24px">
 <div class="cab"><div class="t"><h1>O que muda com o novo design</h1><p class="sub">Comparação entre o documento proposto, a plataforma real e este mockup.</p></div></div>
 <section class="card p6"><h3>Perdas de funcionalidade ou visualização se o documento for seguido ao pé da letra</h3>
 <div class="tbl-wrap"><table><thead><tr><th>Item do documento</th><th>O que a plataforma tem hoje</th><th>Risco</th><th>Proposta no mockup</th></tr></thead><tbody>
 <tr><td>Barra de filtros com selects (FilterBar)</td><td>Painel clicável na lista (pizza + ranking por 9 dimensões, chips de filtro, filtro lembrado por aba)</td><td>${L("t-crit","Perda")}</td><td>Manter o painel clicável da lista; a barra fica só com busca e 2 a 3 seletores rápidos</td></tr>
 <tr><td>Stepper de 5 nós (Cadastrada → Prestação)</td><td>Fluxo por tipo (8 a 12 fases), editável, com fase presumida, "não se aplica" e datas reais</td><td>${L("t-crit","Perda")}</td><td>Stepper com as fases reais do tipo da emenda, rolagem lateral e estado "presumida"</td></tr>
 <tr><td>Status com 5 cores fixas (Paga, Empenhada…)</td><td>11 etapas editáveis em Configurações</td><td>${L("t-warn","Atenção")}</td><td>Cor pelo grupo da etapa (sem andamento, em preparo, empenhada, paga); nome vem do catálogo</td></tr>
 <tr><td>Cartão "Liquidado"</td><td>Liquidação deixou de ser fase (decisão de 13/11); cartões: valor, empenhado, pago, a pagar, sem empenhar</td><td>${L("t-warn","Regressão")}</td><td>Trocado por "A pagar" e "Sem empenhar"; ações de conciliação e encerramento seguem sob os cartões</td></tr>
 <tr><td>"+14,5% vs ano anterior"</td><td>Só existe o exercício 2026</td><td>${L("t-neu","Sem dado")}</td><td>Removido; volta quando houver 2027</td></tr>
 <tr><td>Foto do parlamentar</td><td>Não há campo de foto</td><td>${L("t-neu","Sem dado")}</td><td>Iniciais (fallback previsto no próprio documento)</td></tr>
 <tr><td>Selo "Regular / Pendente de doc." no beneficiário</td><td>Categoria (OSC, SUS, consórcio…), CNPJ validado, documentos faltando por emenda</td><td>${L("t-neu","Sem dado")}</td><td>Derivar o selo dos documentos faltando; não existe certidão de regularidade no banco</td></tr>
 <tr><td>Navegação lateral só do módulo</td><td>Cabeçalho único da Central (sino, feedback, ajuda, tema, zoom, voltar à Central) igual em 6 módulos</td><td>${L("t-warn","Atenção")}</td><td>Barra superior mantém todos esses controles; "Voltar para a Central" no topo da barra lateral</td></tr>
 <tr><td>Só tema claro, tamanhos em px</td><td>Modo escuro, estilo Apple/Clássico e zoom do texto (tudo em rem)</td><td>${L("t-warn","Atenção")}</td><td>Tokens com versão escura (botão da lua no topo); a implementação deve usar rem</td></tr>
 <tr><td>Recharts</td><td>Gráficos próprios em SVG (sem biblioteca)</td><td>${L("t-neu","Escolha")}</td><td>Seguir com SVG próprio: mesmo visual, sem 100 kB a mais</td></tr>
 <tr><td>Wizard de 4 passos na nova emenda</td><td>Formulário único com validação de cota, modalidade e sugestão pela categoria</td><td>${L("t-ok","Ganho")}</td><td>Viável sem perda, desde que cada passo rode as mesmas validações</td></tr>
 </tbody></table></div></section>
 <section class="card p6"><h3>O que se ganha</h3><ul>
 <li>Menu lateral com grupos: hoje as 11 abas do topo quebram linha em telas menores.</li>
 <li>Cartões de indicadores no mesmo formato em todas as telas, com barra de progresso e alerta "ação recomendada".</li>
 <li>Tabela com paginação, ordenação e contagem "Mostrando 1–10 de 215" (hoje a lista é toda carregada de uma vez).</li>
 <li>Detalhe da emenda com fluxo visível no topo e informações gerais fixas na coluna lateral.</li>
 <li>Status com significado imediato (cinza, âmbar, azul, verde) em vez de tons de violeta parecidos.</li></ul></section>
 <section class="card p6"><h3>Decisões para você</h3><ul>
 <li><b>Cor de destaque</b>: violeta (identidade do módulo, igual à faixa do card na Central) ou o verde do documento. Use os botões na faixa do topo para comparar. Recomendo o violeta: o verde-azulado já é a cor do Compras.</li>
 <li><b>Só Emendas ou todos os módulos</b>: a regra da plataforma é um visual único. Se a barra lateral for aprovada, o ideal é levá-la depois a Frotas e Imóveis.</li>
 <li><b>Filtros</b>: manter o painel clicável (recomendado) ou voltar à barra de seletores do documento.</li></ul></section>
 <section class="card p6"><h3>Nada muda por baixo</h3><p>O design atua só na apresentação. Rotas, permissões por secretaria (RLS), propostas de alteração, conciliação, encerramento, portal público, exportações e regras do banco continuam iguais. Este mockup usou os dados reais de 2026 apenas para leitura.</p></section>
 </div>`;
}

/* ---------- roteador ---------- */
function ir(r){location.hash=r}
function rota(){const h=location.hash.slice(1);return NOMES[h]||h==="detalhe"?h:"painel"}
function render(){
 const r=rota();
 document.getElementById("menu").innerHTML=MENU.map(([g,its])=>`<div class="grupo">${g}</div>`+its.map(([k,n,i,o])=>`<a class="item" href="#${k}" ${r===k||(r==="detalhe"&&k==="lista")?'aria-current="page"':""}>${ic(i)}${n}</a>`).join("")).join("");
 const crumb={painel:["Painel"],lista:["Emendas"],detalhe:["Emendas","Detalhes nº "+String(atual).padStart(3,"0")+"/2026"],vereadores:["Vereadores"],analise:["O que muda"]}[r]||[NOMES[r]];
 document.getElementById("crumb").innerHTML=(r==="detalhe"?`<a href="#lista" style="text-decoration:none;color:var(--tx-2);margin-right:6px">← Voltar</a>`:"")+["Início","Emendas Impositivas",...crumb].map((c,i,a)=>i===a.length-1?`<b>${esc(c)}</b>`:esc(c)).join(" › ");
 const c=document.getElementById("conteudo");
 c.innerHTML=r==="painel"?painel():r==="lista"?lista():r==="detalhe"?detalhe():r==="vereadores"?vereadores():r==="analise"?analise():
  `<div class="cab"><div class="t"><h1>${esc(NOMES[r])}</h1><p class="sub">Fora do mockup.</p></div></div><section class="card placeholder"><div><b>Tela mantida como hoje, com o novo visual</b>O mockup cobre Painel, Emendas, Detalhe, Vereadores e a avaliação "O que muda".</div></section>`;
 grafMensal();grafDonut();tabela();ligarFiltros();
 document.getElementById("side").classList.remove("aberta");
}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
document.getElementById("hamb").onclick=()=>document.getElementById("side").classList.toggle("aberta");
document.getElementById("tema").onclick=()=>{const d=document.documentElement;const esc=d.dataset.theme==="dark"||(!d.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);d.dataset.theme=esc?"light":"dark"};
document.querySelectorAll("[data-acento]").forEach(b=>b.onclick=()=>{document.documentElement.dataset.acento=b.dataset.acento;document.querySelectorAll("[data-acento]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
render();
</script>
